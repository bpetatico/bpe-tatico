    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const BPE_SUPABASE_URL = "https://eplpkbsdpqkqdjhdrxph.supabase.co";
        const BPE_SUPABASE_KEY = "sb_publishable_2czuKM0vH23EdhH5_lC7Lg_q2KUbFal";
        const bpeSupabase = window.supabase.createClient(BPE_SUPABASE_URL, BPE_SUPABASE_KEY);
        const BPE_SHARED_KEYS = [
            'usuariosBPE', 'bancoUsuariosBPE', 'historicoPontosBPE', 'rankingApreensoesBPE',
            'topMateriaisBPE', 'bancoRelatoriosBPE', 'bancoLogsDelecaoBPE', 'bancoAusenciasBPE',
            'bancoBoletinsBPE', 'bancoSolicitacoesAcessoBPE', 'bancoNecrotecaBPE',
            'bancoExoneradosBPE', 'bancoHeroisBPE', 'bpePolicialDestaque', 'historiaBPE'
        ];
        let bpeBancoPronto = false;
        let bpeSincronizando = null;

        async function bpeSalvarNuvem(chave, valor) {
            try {
                const { error } = await bpeSupabase.from('bpe_store').upsert({
                    chave,
                    valor,
                    atualizado_em: new Date().toISOString()
                }, { onConflict: 'chave' });
                if (error) console.error('[BPE] Erro ao salvar', chave, error);
            } catch (e) {
                console.error('[BPE] Falha de conexão ao salvar', chave, e);
            }
        }

        async function sincronizarBancoBPE(opcoes = {}) {
            if (bpeSincronizando) return bpeSincronizando;
            bpeSincronizando = (async () => {
                try {
                    const { data, error } = await bpeSupabase.from('bpe_store').select('chave,valor,atualizado_em');
                    if (error) throw error;

                    const linhas = Array.isArray(data) ? data : [];
                    const mapa = new Map(linhas.map(x => [x.chave, x]));

                    // Primeira conexão: se o banco estiver vazio, migra o conteúdo local existente.
                    if (linhas.length === 0) {
                        for (const chave of BPE_SHARED_KEYS) {
                            const raw = localStorage.getItem(chave);
                            if (raw !== null) {
                                try {
                                    const valor = JSON.parse(raw);
                                    await bpeSalvarNuvem(chave, valor);
                                } catch (_) {}
                            }
                        }
                    } else {
                        // Banco é a fonte oficial. O cache local só acompanha o Supabase.
                        for (const chave of BPE_SHARED_KEYS) {
                            if (mapa.has(chave)) {
                                localStorage.setItem(chave, JSON.stringify(mapa.get(chave).valor));
                            }
                        }
                    }

                    bpeBancoPronto = true;
                    return true;
                } catch (e) {
                    console.error('[BPE] Não foi possível sincronizar com o Supabase.', e);
                    bpeBancoPronto = false;
                    return false;
                } finally {
                    bpeSincronizando = null;
                }
            })();
            return bpeSincronizando;
        }

        async function bpeForcarSincronizacao() {
            return sincronizarBancoBPE({ force: true });
        }

        // Atualização periódica: outros usuários passam a aparecer sem precisar fechar o site.
        setInterval(async () => {
            if (document.visibilityState === 'visible') {
                const ok = await sincronizarBancoBPE({ force: true });
                if (ok && typeof atualizarTabelasGerais === 'function') {
                    try {
                        if (typeof renderizarHierarquiaGeral === 'function') renderizarHierarquiaGeral();
                        if (typeof renderizarBoletinsECommunicados === 'function') renderizarBoletinsECommunicados();
                        if (typeof renderizarMuralHerois === 'function') renderizarMuralHerois();
                        if (typeof renderizarMuralRSO === 'function') renderizarMuralRSO();
                        if (typeof renderizarMuralAusencias === 'function') renderizarMuralAusencias();
                        if (typeof renderizarNecroteca === 'function') renderizarNecroteca();
                        if (typeof renderizarHistoriaBPE === 'function') renderizarHistoriaBPE();
                        atualizarTabelasGerais();
                    } catch (_) {}
                }
            }
        }, 15000);
    </script>
        <script>
        // Inicializa o banco de dados interno se não existir
        if (!localStorage.getItem('usuariosBPE')) {
            localStorage.setItem('usuariosBPE', JSON.stringify([]));
        }

        // Função para alternar visualmente entre as abas de Login e Cadastro
        function mudarAba(tipo) {
            const formLogin = document.getElementById('form-login');
            const formCadastro = document.getElementById('form-cadastro');
            const tabLogin = document.getElementById('tab-login');
            const tabCadastro = document.getElementById('tab-cadastro');

            // Limpa os campos ao trocar de aba para evitar bugs de dados fantasmas
            formLogin.reset();
            formCadastro.reset();

            if(tipo === 'login') {
                formLogin.classList.remove('hidden');
                formCadastro.classList.add('hidden');
                tabLogin.classList.add('active');
                tabCadastro.classList.remove('active');
            } else {
                formLogin.classList.add('hidden');
                formCadastro.classList.remove('hidden');
                tabLogin.classList.remove('active');
                tabCadastro.classList.add('active');
            }
        }

        // LÓGICA DE LOGIN (SEGUNDO ACESSO EM DIANTE)
               // LÓGICA DE LOGIN INTEGRADA COM CARGOS DINÂMICOS
        async function executarLogin(event) {
            event.preventDefault();
            await sincronizarBancoBPE();
            const entrada = document.getElementById('usuario-login').value.trim();
            
            if (!entrada) {
                alert("⚠️ Por favor, digite seu usuário cadastrado!");
                return;
            }

            // Atalho clássico de emergência do Comando Supremo
            if (entrada === "altocomando") {
                localStorage.setItem('usuarioLogado', 'Alto Comando');
                localStorage.setItem('cargoUsuario', 'coronel');
                alert("✨ ALTO COMANDO reconhecido! Entrando no painel supremo...");
                window.location.href = "painel.html";
                return;
            }

            const usuarios = JSON.parse(localStorage.getItem('usuariosBPE')) || [];
            const bancoGeral = JSON.parse(localStorage.getItem('bancoUsuariosBPE')) || [];
            
            const usuarioEncontrado = usuarios.find(u => u.nome.toLowerCase() === entrada.toLowerCase());

            if (usuarioEncontrado) {
                localStorage.setItem('usuarioLogado', usuarioEncontrado.nome);
                localStorage.setItem('idLogado', usuarioEncontrado.id);
                
                // Caça qual é o cargo/patente real dele na tabela da hierarquia
                const cadastroHierarquia = bancoGeral.find(u => u.usuario.toLowerCase() === entrada.toLowerCase());
                const cargoReal = cadastroHierarquia ? cadastroHierarquia.cargo : (usuarioEncontrado.estagio === 'sim' ? 'estagio' : 'membro-comum');
                
                localStorage.setItem('cargoUsuario', cargoReal);
                
                alert(`🔓 Login autorizado! Bem-vindo de volta, ${usuarioEncontrado.nome}.`);
                window.location.href = "painel.html";
            } else {
                alert(`❌ ERRO: O usuário "${entrada}" não consta no sistema.\n\nSe esta é sua primeira vez no site, vá na aba "Primeiro Acesso" para fazer o registro.`);
            }
        }

        // LÓGICA DE CADASTRO (PRIMEIRO ACESSO)
              // LÓGICA DE CADASTRO ATUALIZADA (COM TRAVA DE SENHA ALTOCOMANDO)
               // LÓGICA DE CADASTRO SEM PROMPTS: FILTRO DE SENHA BASEADO NA PATENTE DIGITADA
        async function executarCadastro(event) {
            event.preventDefault();
            await sincronizarBancoBPE();
            const nome = document.getElementById('nome-cadastro').value.trim();
            const id = document.getElementById('id-cadastro').value.trim();
            const estagio = document.querySelector('input[name="estagio"]:checked').value;
            const senhaBatalhao = document.getElementById('senha-cadastro-batalhao').value.trim();

            // Transforma o nome digitado em letras minúsculas para escanear a patente digitada
            const nomeMinusculo = nome.toLowerCase();
            let cargoDefinido = "membro-comum";

            // 1. CHECAGEM DO ALTO COMANDO (MÁGICA AUTOMÁTICA)
                 // CORREÇÃO OPERACIONAL: LEITURA PRECISA E ALERT LIMPO SEM REPETIÇÕES
            if (senhaBatalhao === "altocomando") {
                if (senhaBatalhao !== "altocomando") {
                    alert("❌ HOMOLOGAÇÃO NEGADA:\nVocê inseriu uma patente de ALTO COMANDO, mas digitou a senha incorreta.");
                    return;
                }
                
                // CORREÇÃO DE FILTRO: Checa primeiro a patente mais longa para não confundir Tenente-Coronel com Major ou Tenente
                if (nomeMinusculo.includes("tenente-coronel") || nomeMinusculo.includes("tenentecoronel") || nomeMinusculo.includes("tenente coronel")) {
                    cargoDefinido = "tenente-coronel";
                } else if (nomeMinusculo.includes("coronel")) {
                    cargoDefinido = "coronel";
                } else {
                    cargoDefinido = "major";
                }
            } else {
                if (senhaBatalhao !== "membros") {
                    alert("❌ ACESSO NEGADO:\nA senha do batalhão está incorreta!");
                    return;
                }
                cargoDefinido = estagio === 'sim' ? 'estagio' : 'membro-comum';
            }

            // [Mantenha a parte do meio que salva nos bancos 'usuariosBPE' e 'bancoUsuariosBPE' igual]
            const usuarios = JSON.parse(localStorage.getItem('usuariosBPE')) || [];
            const bancoUsuariosGerais = JSON.parse(localStorage.getItem('bancoUsuariosBPE')) || [];
            if (usuarios.some(u => u.nome.toLowerCase() === nome.toLowerCase())) {
                alert(`⚠️ ATENÇÃO: O policial "${nome}" já possui um cadastro ativo no sistema!`);
                return;
            }
            usuarios.push({ nome, id, estagio });
            localStorage.setItem('usuariosBPE', JSON.stringify(usuarios));
            await bpeSalvarNuvem('usuariosBPE', usuarios);
            bancoUsuariosGerais.push({ id: id, usuario: nome, patente: cargoDefinido.toUpperCase(), cargo: cargoDefinido });
            localStorage.setItem('bancoUsuariosBPE', JSON.stringify(bancoUsuariosGerais));
            await bpeSalvarNuvem('bancoUsuariosBPE', bancoUsuariosGerais);
            localStorage.setItem('usuarioLogado', nome);
            localStorage.setItem('idLogado', id);
            localStorage.setItem('cargoUsuario', cargoDefinido);

            // ALERT TOTALMENTE LIMPO E SEM REDUNDÂNCIAS
            if (senhaBatalhao === "altocomando") {
                alert(`👑 ALTO COMANDO HOMOLOGADO:\nOficial: ${nome}\n\nEntrando no painel operacional com poder supremo...`);
            } else {
                alert(`✅ CADASTRO HOMOLOGADO:\nPolicial: ${nome}\nID: ${id}\n\nEntrando no painel de patrulha...`);
            }
            
            window.location.href = "painel.html";
        }



        // Lógica do botão do Olhinho
        function toggleSenha() {
            const campoSenha = document.getElementById('senha-cadastro-batalhao');
            const botaoOlho = document.querySelector('.toggle-password');
            
            if (campoSenha.type === 'password') {
                campoSenha.type = 'text';
                botaoOlho.textContent = '🙈';
            } else {
                campoSenha.type = 'password';
                botaoOlho.textContent = '👁️';
            }
        }
    </script>
