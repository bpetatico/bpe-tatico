    <script>
        const BPE_SUPABASE_URL = "https://eplpkbsdpqkqdjhdrxph.supabase.co";
        const BPE_SUPABASE_KEY = "sb_publishable_2czuKM0vH23EdhH5_lC7Lg_q2KUbFal";
        const bpeSupabase = window.supabase.createClient(BPE_SUPABASE_URL, BPE_SUPABASE_KEY);
        const BPE_SHARED_KEYS = [
            'usuariosBPE', 'bancoUsuariosBPE', 'historicoPontosBPE', 'rankingApreensoesBPE',
            'topMateriaisBPE', 'bancoRelatoriosBPE', 'bancoLogsDelecaoBPE', 'bancoAusenciasBPE',
            'bancoBoletinsBPE', 'bancoSolicitacoesAcessoBPE', 'bancoNecrotecaBPE',
            'bancoExoneradosBPE', 'bancoHeroisBPE', 'bpePolicialDestaque', 'historiaBPE'
        ];
        let bpeBancoPronto = false;
        let bpeSincronizando = null;

        async function bpeSalvarNuvem(chave, valor) {
            try {
                const { error } = await bpeSupabase.from('bpe_store').upsert({
                    chave,
                    valor,
                    atualizado_em: new Date().toISOString()
                }, { onConflict: 'chave' });
                if (error) console.error('[BPE] Erro ao salvar', chave, error);
            } catch (e) {
                console.error('[BPE] Falha de conexão ao salvar', chave, e);
            }
        }

        async function sincronizarBancoBPE(opcoes = {}) {
            if (bpeSincronizando) return bpeSincronizando;
            bpeSincronizando = (async () => {
                try {
                    const { data, error } = await bpeSupabase.from('bpe_store').select('chave,valor,atualizado_em');
                    if (error) throw error;

                    const linhas = Array.isArray(data) ? data : [];
                    const mapa = new Map(linhas.map(x => [x.chave, x]));

                    // Primeira conexão: se o banco estiver vazio, migra o conteúdo local existente.
                    if (linhas.length === 0) {
                        for (const chave of BPE_SHARED_KEYS) {
                            const raw = localStorage.getItem(chave);
                            if (raw !== null) {
                                try {
                                    const valor = JSON.parse(raw);
                                    await bpeSalvarNuvem(chave, valor);
                                } catch (_) {}
                            }
                        }
                    } else {
                        // Banco é a fonte oficial. O cache local só acompanha o Supabase.
                        for (const chave of BPE_SHARED_KEYS) {
                            if (mapa.has(chave)) {
                                localStorage.setItem(chave, JSON.stringify(mapa.get(chave).valor));
                            }
                        }
                    }

                    bpeBancoPronto = true;
                    return true;
                } catch (e) {
                    console.error('[BPE] Não foi possível sincronizar com o Supabase.', e);
                    bpeBancoPronto = false;
                    return false;
                } finally {
                    bpeSincronizando = null;
                }
            })();
            return bpeSincronizando;
        }

        async function bpeForcarSincronizacao() {
            return sincronizarBancoBPE({ force: true });
        }

        // Atualização periódica: outros usuários passam a aparecer sem precisar fechar o site.
        setInterval(async () => {
            if (document.visibilityState === 'visible') {

                        if (typeof renderizarHistoriaBPE === 'function') renderizarHistoriaBPE();
                        atualizarTabelasGerais();
                    } catch (_) {}
                }
            }
        }, 15000);
    </script>
        <script>
        // Inicializa o banco de dados interno se não existir
        if (!localStorage.getItem('usuariosBPE')) {
            localStorage.setItem('usuariosBPE', JSON.stringify([]));
        }

        let modoRecuperacaoSenha = false;

        function atualizarVisualCadastro() {
            const titulo = document.getElementById('modo-cadastro-titulo');
            const nomeLabel = document.getElementById('label-nome-cadastro');
            const idLabel = document.getElementById('label-id-cadastro');

            const tabCadastro = document.getElementById('tab-cadastro');

            if (!titulo) return;

            if (modoRecuperacaoSenha) {
                titulo.textContent = 'RECUPERAÇÃO DA SENHA PESSOAL';
                titulo.classList.remove('hidden');
                nomeLabel.textContent = 'Patente e Nome';
                idLabel.textContent = 'ID do Jogo';
                batalhaoLabel.textContent = 'Senha do Batalhão';
                pessoalLabel.textContent = 'Registre sua Nova Senha Pessoal';
                confirmacaoLabel.textContent = 'Confirme sua Nova Senha Pessoal';
                submit.textContent = 'Atualizar Senha Pessoal';
                tabCadastro.textContent = 'Recuperar Senha';
            } else {
                titulo.textContent = 'PRIMEIRO ACESSO';
                titulo.classList.remove('hidden');
                nomeLabel.textContent = 'Nome de Usuário (Patente e Nome)';
                idLabel.textContent = 'ID do Jogo';
                batalhaoLabel.textContent = 'Senha do Batalhão';
                pessoalLabel.textContent = 'Registre sua Senha Pessoal';
                confirmacaoLabel.textContent = 'Confirme sua Senha Pessoal';
                submit.textContent = 'Registrar no Sistema';
                tabCadastro.textContent = 'Primeiro Acesso';
            }
        }

        function abrirRecuperacaoSenha() {
            modoRecuperacaoSenha = true;
            const formLogin = document.getElementById('form-login');
            const formCadastro = document.getElementById('form-cadastro');
            const tabLogin = document.getElementById('tab-login');
            const tabCadastro = document.getElementById('tab-cadastro');

            formLogin.reset();
            formCadastro.reset();
            formLogin.classList.add('hidden');
            formCadastro.classList.remove('hidden');
            tabLogin.classList.remove('active');
            tabCadastro.classList.add('active');
            atualizarVisualCadastro();

            document.getElementById('nome-cadastro').focus();
        }

        // Função para alternar visualmente entre as abas de Login e Cadastro
        function mudarAba(tipo) {
            const formLogin = document.getElementById('form-login');
            const formCadastro = document.getElementById('form-cadastro');
            const tabLogin = document.getElementById('tab-login');
            const tabCadastro = document.getElementById('tab-cadastro');

            // Limpa os campos ao trocar de aba para evitar bugs de dados fantasmas
            formLogin.reset();
            formCadastro.reset();
            modoRecuperacaoSenha = false;

            if(tipo === 'login') {
                formLogin.classList.remove('hidden');
                formCadastro.classList.add('hidden');
                tabLogin.classList.add('active');
                tabCadastro.classList.remove('active');
            } else {
                formLogin.classList.add('hidden');
                formCadastro.classList.remove('hidden');
                tabLogin.classList.remove('active');
                tabCadastro.classList.add('active');
                atualizarVisualCadastro();
            }
        }

        // ============================================================
        // AUTENTICAÇÃO DO BPE TÁTICO
        // A senha pessoal é armazenada somente como hash SHA-256.
        // A senha do batalhão (altocomando/membros) continua existindo
        // apenas para homologar o PRIMEIRO cadastro.
        // ============================================================

        async function gerarHashSenha(senha) {
            const dados = new TextEncoder().encode(senha);
            const buffer = await crypto.subtle.digest('SHA-256', dados);
            return Array.from(new Uint8Array(buffer))
                .map(byte => byte.toString(16).padStart(2, '0'))
                .join('');
        }

        // LÓGICA DE LOGIN (SEGUNDO ACESSO EM DIANTE)
        async function executarLogin(event) {
            event.preventDefault();

            const ok = await sincronizarBancoBPE();
            if (!ok) {
                alert("❌ Não foi possível conectar ao banco de dados. Tente novamente em alguns segundos.");
                return;
            }

            const entrada = document.getElementById('usuario-login').value.trim();
            const senhaPessoal = document.getElementById('senha-login-pessoal').value;

            if (!entrada || !senhaPessoal) {
                alert("⚠️ Informe sua patente/nome e sua senha pessoal.");
                return;
            }

            const usuarios = JSON.parse(localStorage.getItem('usuariosBPE')) || [];
            const bancoGeral = JSON.parse(localStorage.getItem('bancoUsuariosBPE')) || [];

            const usuarioEncontrado = usuarios.find(u =>
                String(u.nome || '').trim().toLowerCase() === entrada.toLowerCase()
            );

            if (!usuarioEncontrado) {
                alert(`❌ ERRO: O usuário "${entrada}" não consta no sistema.`);
                return;
            }

            // Registros antigos não possuem senha pessoal.
            if (!usuarioEncontrado.senhaPessoalHash) {
                alert("⚠️ Este cadastro ainda não possui uma senha pessoal.\n\nO policial precisa realizar o cadastro/atualização da senha pessoal antes de acessar o painel.");
                return;
            }

            const hashInformado = await gerarHashSenha(senhaPessoal);
            if (hashInformado !== usuarioEncontrado.senhaPessoalHash) {
                alert("❌ SENHA PESSOAL INCORRETA.\n\nO acesso não foi autorizado.");
                return;
            }

            // TRAVA DE EXONERAÇÃO:
            // um policial exonerado não pode voltar diretamente pelo login.
            // Depois de autenticado com a senha pessoal, ele precisa solicitar
            // formalmente o retorno e aguardar a decisão do Alto Comando.
            const exonerados = JSON.parse(localStorage.getItem('bancoExoneradosBPE')) || [];
            const registroExonerado = exonerados.find(x => String(x.id) === String(usuarioEncontrado.id));

            if (registroExonerado && registroExonerado.retornouAoBatalhao !== true) {
                const solicitacoes = JSON.parse(localStorage.getItem('bancoSolicitacoesAcessoBPE')) || [];
                const pendente = solicitacoes.find(r =>
                    String(r.id) === String(usuarioEncontrado.id) && r.status === 'pendente'
                );

                if (!pendente) {
                    solicitacoes.unshift({
                        id: String(usuarioEncontrado.id),
                        usuario: usuarioEncontrado.nome,
                        cargo: localStorage.getItem('cargoUsuario') || 'membro-comum',
                        tipo: 'retorno-exonerado',
                        data: new Date().toLocaleString('pt-BR'),
                        status: 'pendente',
                        motivo: 'Policial exonerado solicitou autorização para retornar ao batalhão.'
                    });
                    localStorage.setItem('bancoSolicitacoesAcessoBPE', JSON.stringify(solicitacoes));
                    await bpeSalvarNuvem('bancoSolicitacoesAcessoBPE', solicitacoes);
                }

                localStorage.removeItem('usuarioLogado');
                localStorage.removeItem('idLogado');
                localStorage.removeItem('cargoUsuario');

                alert("🚫 ACESSO BLOQUEADO\n\nSeu cadastro consta como EXONERADO.\n\n📨 Uma solicitação de retorno foi enviada ao Alto Comando.\n\nAguarde a avaliação do Coronel. O acesso ao painel somente será liberado após aprovação.");
                return;
            }

            localStorage.setItem('usuarioLogado', usuarioEncontrado.nome);
            localStorage.setItem('idLogado', usuarioEncontrado.id);

            const cadastroHierarquia = bancoGeral.find(u =>
                String(u.usuario || '').trim().toLowerCase() === entrada.toLowerCase()
            );
            const cargoReal = cadastroHierarquia
                ? cadastroHierarquia.cargo
                : (usuarioEncontrado.estagio === 'sim' ? 'estagio' : 'membro-comum');

            localStorage.setItem('cargoUsuario', cargoReal);

            alert(`🔓 LOGIN AUTORIZADO!\nBem-vindo de volta, ${usuarioEncontrado.nome}.`);
            window.location.href = "painel.html";
        }

        // LÓGICA DE CADASTRO (PRIMEIRO ACESSO)
        async function executarCadastro(event) {
            event.preventDefault();

            const ok = await sincronizarBancoBPE();
            if (!ok) {
                alert("❌ Não foi possível conectar ao banco de dados. Tente novamente em alguns segundos.");
                return;
            }

            const nome = document.getElementById('nome-cadastro').value.trim();
            const id = document.getElementById('id-cadastro').value.trim();
            const estagio = document.querySelector('input[name="estagio"]:checked').value;
            const senhaBatalhao = document.getElementById('senha-cadastro-batalhao').value.trim();
            const senhaPessoal = document.getElementById('senha-pessoal-cadastro').value;
            const senhaPessoalConfirmacao = document.getElementById('senha-pessoal-confirmacao').value;

            // MODO RECUPERAÇÃO: atualiza somente a senha pessoal de um cadastro existente.
            // A senha do batalhão continua sendo usada como confirmação de autorização.
            if (modoRecuperacaoSenha) {
                if (senhaPessoal.length < 6) {
                    alert("❌ A nova senha pessoal precisa ter no mínimo 6 caracteres.");
                    return;
                }

                if (senhaPessoal !== senhaPessoalConfirmacao) {
                    alert("❌ A confirmação da nova senha pessoal não confere.");
                    return;
                }

                const usuarioExistente = usuarios.find(u =>
                    String(u.nome || '').trim().toLowerCase() === nome.toLowerCase() &&
                    String(u.id || '') === String(id)
                );

                if (!usuarioExistente) {
                    alert("❌ CADASTRO NÃO LOCALIZADO. Confira a patente/nome e o ID do jogo.");
                    return;
                }

                if (senhaBatalhao !== "altocomando" && senhaBatalhao !== "membros") {
                    alert("❌ AUTORIZAÇÃO NEGADA:\nA senha do batalhão está incorreta.");
                    return;
                }

                usuarioExistente.senhaPessoalHash = await gerarHashSenha(senhaPessoal);
                usuarioExistente.senhaPessoalVersao = (Number(usuarioExistente.senhaPessoalVersao) || 1) + 1;
                usuarioExistente.senhaPessoalAtualizadaEm = new Date().toISOString();

                localStorage.setItem('usuariosBPE', JSON.stringify(usuarios));
                await bpeSalvarNuvem('usuariosBPE', usuarios);

                modoRecuperacaoSenha = false;
                document.getElementById('form-cadastro').reset();
                mudarAba('login');

                // Recoloca o nome no login para facilitar o acesso após a recuperação.
                document.getElementById('usuario-login').value = nome;

                alert("✅ SENHA PESSOAL ATUALIZADA!\n\nAgora você pode entrar normalmente usando seu nome/patente e a nova senha pessoal.");
                return;
            }

            if (senhaPessoal.length < 6) {
                alert("❌ A senha pessoal precisa ter no mínimo 6 caracteres.");
                return;
            }

            if (senhaPessoal !== senhaPessoalConfirmacao) {
                alert("❌ A confirmação da senha pessoal não confere.");
                return;
            }

            const nomeMinusculo = nome.toLowerCase();
            let cargoDefinido = "membro-comum";

            // A senha do batalhão continua sendo a chave de homologação do cadastro.
            if (senhaBatalhao === "altocomando") {
                if (nomeMinusculo.includes("tenente-coronel") || nomeMinusculo.includes("tenentecoronel") || nomeMinusculo.includes("tenente coronel")) {
                    cargoDefinido = "tenente-coronel";
                } else if (nomeMinusculo.includes("coronel")) {
                    cargoDefinido = "coronel";
                } else {
                    cargoDefinido = "major";
                }
            } else if (senhaBatalhao === "membros") {
                cargoDefinido = estagio === 'sim' ? 'estagio' : 'membro-comum';
            } else {
                alert("❌ ACESSO NEGADO:\nA senha do batalhão está incorreta!");
                return;
            }

            const usuarios = JSON.parse(localStorage.getItem('usuariosBPE')) || [];
            const bancoUsuariosGerais = JSON.parse(localStorage.getItem('bancoUsuariosBPE')) || [];

            if (usuarios.some(u => String(u.nome || '').toLowerCase() === nome.toLowerCase())) {
                alert(`⚠️ ATENÇÃO: O policial "${nome}" já possui um cadastro ativo no sistema.\n\nSe este é o seu cadastro antigo, ele precisa receber uma senha pessoal antes do primeiro login com a nova segurança.`);
                return;
            }

            const senhaPessoalHash = await gerarHashSenha(senhaPessoal);

            // A senha pessoal NUNCA é salva em texto puro.
            usuarios.push({
                nome,
                id,
                estagio,
                senhaPessoalHash,
                senhaPessoalVersao: 1
            });

            localStorage.setItem('usuariosBPE', JSON.stringify(usuarios));
            await bpeSalvarNuvem('usuariosBPE', usuarios);

            bancoUsuariosGerais.push({
                id: id,
                usuario: nome,
                patente: cargoDefinido.toUpperCase(),
                cargo: cargoDefinido
            });

            localStorage.setItem('bancoUsuariosBPE', JSON.stringify(bancoUsuariosGerais));
            await bpeSalvarNuvem('bancoUsuariosBPE', bancoUsuariosGerais);

            localStorage.setItem('usuarioLogado', nome);
            localStorage.setItem('idLogado', id);
            localStorage.setItem('cargoUsuario', cargoDefinido);

            if (senhaBatalhao === "altocomando") {
                alert(`👑 ALTO COMANDO HOMOLOGADO:\nOficial: ${nome}\n\nSua senha pessoal foi registrada. Entrando no painel operacional com poder supremo...`);
            } else {
                alert(`✅ CADASTRO HOMOLOGADO:\nPolicial: ${nome}\nID: ${id}\n\nSua senha pessoal foi registrada. Entrando no painel de patrulha...`);
            }

            window.location.href = "painel.html";
        }


        // Lógica dos botões do Olhinho
        function alternarCampoSenha(idCampo, botao) {
            const campo = document.getElementById(idCampo);
            if (!campo) return;
            if (campo.type === 'password') {
                campo.type = 'text';
                botao.textContent = '🙈';
            } else {
                campo.type = 'password';
                botao.textContent = '👁️';
            }
        }

        function toggleSenha(botao) {
            alternarCampoSenha('senha-cadastro-batalhao', botao);
        }

        function toggleSenhaPessoal(botao) {
            alternarCampoSenha('senha-pessoal-cadastro', botao);
        }

        function toggleSenhaConfirmacao(botao) {
            alternarCampoSenha('senha-pessoal-confirmacao', botao);
        }

        function toggleSenhaLogin(botao) {
            alternarCampoSenha('senha-login-pessoal', botao);
        }
    </script>

</body>
</html>
